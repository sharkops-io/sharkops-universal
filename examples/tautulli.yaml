# Simple Tautulli example
# This is a clean, straightforward configuration for Tautulli

image:
  repository: lscr.io/linuxserver/tautulli
  tag: latest

service:
  ports:
    - name: http
      port: 8181
      targetPort: 8181
      protocol: TCP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: tautulli.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tautulli-tls
      hosts:
        - tautulli.example.com

# Persistence configuration
# Tautulli needs persistent storage for its configuration and database
persistence:
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /config
  # No additional volumes needed for basic Tautulli setup


# Environment variables
env:
  values:
    # LinuxServer.io environment variables
    PUID: 1000
    PGID: 1000
    TZ: America/New_York
    # Tautulli specific environment variables
    UMASK_SET: 002

