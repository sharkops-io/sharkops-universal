# Example values for Tautulli
image:
  repository: lscr.io/linuxserver/tautulli
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8181
      targetPort: 8181
      protocol: TCP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: tautulli.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tautulli-tls
      hosts:
        - tautulli.example.com

persistence:
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /config

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

linuxserver:
  env:
    PUID: 1000
    PGID: 1000
    TZ: America/New_York
    UMASK_SET: 002

  volumes:
    - name: config
      mountPath: /config

  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8181
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8181
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
