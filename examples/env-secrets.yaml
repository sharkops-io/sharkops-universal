# Example: Environment variables and secrets management
# This example shows how to use various sources for environment variables and secrets

# Image configuration
image:
  repository: lscr.io/linuxserver/tautulli
  tag: latest
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 8181
  targetPort: 8181

# Persistence configuration
persistence:
  enabled: false  # Disable main persistence, use custom volume below
  volumes:
    - name: config
      mountPath: /config
      persistence:
        enabled: true
        size: 5Gi
        storageClass: "fast-ssd"
        accessMode: ReadWriteOnce

# Environment variables and secrets management
env:
  # Direct environment variables (key-value pairs)
  values:
    LOG_LEVEL: "info"
    DEBUG: "true"
    APP_MODE: "production"

  # Environment variables from ConfigMaps
  configMaps:
    - name: "app-config"  # All keys from this ConfigMap will be included
    - name: "global-config"
      keys: ["GLOBAL_SETTING", "FEATURE_FLAG"]  # Only specific keys

  # Environment variables from Secrets
  secrets:
    - name: "app-secrets"
      keys: ["DB_PASSWORD", "API_KEY"]  # Only specific keys
    - name: "global-secrets"  # All keys from this Secret will be included

# Secret mounts (mount secrets as files)
secretMounts:
  - name: "ssl-certs"
    secretName: "ssl-secret"
    mountPath: "/etc/ssl/certs"
    defaultMode: 0400
  - name: "config-files"
    secretName: "app-config-secret"
    mountPath: "/etc/app/config"
    subPath: "config.yaml"  # Mount specific key as file
    defaultMode: 0600

# Environment variables
env:
  values:
    # LinuxServer.io environment variables
    PUID: 1000
    PGID: 1000
    TZ: America/New_York
    # App specific environment variables
    UMASK_SET: 002

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 8181
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 8181
  initialDelaySeconds: 5
  periodSeconds: 5

# Resources
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi
