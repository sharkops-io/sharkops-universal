# Example values for Sonarr
image:
  repository: lscr.io/linuxserver/sonarr
  tag: latest

service:
  ports:
    - name: http
      port: 8989
      targetPort: 8989
      protocol: TCP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: sonarr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sonarr-tls
      hosts:
        - sonarr.example.com

# Persistence configuration
# Sonarr needs persistent storage for config and media libraries
persistence:
  # Main persistence for Sonarr configuration
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /config
  
  # Additional volumes for downloads and TV shows
  volumes:
    - name: downloads
      mountPath: /downloads
      persistence:
        enabled: true
        size: 50Gi
        storageClass: "fast-ssd"
        accessMode: ReadWriteOnce
    - name: tv
      mountPath: /tv
      persistence:
        enabled: true
        size: 200Gi
        storageClass: "fast-ssd"
        accessMode: ReadWriteOnce

# Environment variables
env:
  values:
    # LinuxServer.io environment variables
    PUID: 1000
    PGID: 1000
    TZ: America/New_York
    # Sonarr specific environment variables
    UMASK_SET: 002
