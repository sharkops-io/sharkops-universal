# Example values for Plex Media Server
image:
  repository: lscr.io/linuxserver/plex
  tag: latest

service:
  ports:
    - name: http
      port: 32400
      targetPort: 32400
      protocol: TCP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: plex.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: plex-tls
      hosts:
        - plex.example.com

# Persistence configuration
# Plex needs persistent storage for config and media libraries
persistence:
  # Main persistence for Plex configuration
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /config
  
  # Additional volumes for media libraries
  volumes:
    - name: downloads
      mountPath: /downloads
      persistence:
        enabled: true
        size: 100Gi
        storageClass: "fast-ssd"
        accessMode: ReadWriteOnce
    - name: media
      mountPath: /media
      persistence:
        enabled: true
        size: 500Gi
        storageClass: "fast-ssd"
        accessMode: ReadWriteOnce

# Environment variables
env:
  values:
    # LinuxServer.io environment variables
    PUID: 1000
    PGID: 1000
    TZ: America/New_York
    # Plex specific environment variables
    VERSION: docker
    PLEX_CLAIM: "claim-xxxxxxxxxxxxxxxxxxxx"
