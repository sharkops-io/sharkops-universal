# Example values for Plex Media Server
image:
  repository: lscr.io/linuxserver/plex
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    - name: http
      port: 32400
      targetPort: 32400
      protocol: TCP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: plex.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: plex-tls
      hosts:
        - plex.example.com

persistence:
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /config

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

linuxserver:
  env:
    PUID: 1000
    PGID: 1000
    TZ: America/New_York
    VERSION: docker
    PLEX_CLAIM: "claim-xxxxxxxxxxxxxxxxxxxx"

  volumes:
    - name: config
      mountPath: /config
    - name: downloads
      mountPath: /downloads
    - name: media
      mountPath: /media

  volumeClaims:
    - name: downloads
      size: 100Gi
      storageClass: "fast-ssd"
      accessMode: ReadWriteOnce
    - name: media
      size: 500Gi
      storageClass: "fast-ssd"
      accessMode: ReadWriteOnce

  livenessProbe:
    enabled: true
    httpGet:
      path: /web
      port: 32400
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /web
      port: 32400
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
