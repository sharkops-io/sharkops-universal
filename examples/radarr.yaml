# Example values for Radarr
image:
  repository: lscr.io/linuxserver/radarr
  tag: latest

service:
  ports:
    - name: http
      port: 7878
      targetPort: 7878
      protocol: TCP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: radarr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: radarr-tls
      hosts:
        - radarr.example.com

# Persistence configuration
# Radarr needs persistent storage for config and media libraries
persistence:
  # Main persistence for Radarr configuration
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /config
  
  # Additional volumes for downloads and movies
  volumes:
    - name: downloads
      mountPath: /downloads
      persistence:
        enabled: true
        size: 50Gi
        storageClass: "fast-ssd"
        accessMode: ReadWriteOnce
    - name: movies
      mountPath: /movies
      persistence:
        enabled: true
        size: 200Gi
        storageClass: "fast-ssd"
        accessMode: ReadWriteOnce

# Environment variables
env:
  values:
    # LinuxServer.io environment variables
    PUID: 1000
    PGID: 1000
    TZ: America/New_York
    # Radarr specific environment variables
    UMASK_SET: 002
