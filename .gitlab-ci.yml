stages:
  - lint
  - test
  - package
  - deploy

variables:
  CHART_NAME: "linuxserver-universal"

# Lint and test the chart
lint-and-test:
  stage: lint
  image: alpine:latest
  before_script:
    - apk add --no-cache helm
  script:
    - helm lint .
    - helm template test-release . --debug
    - helm install --dry-run --debug test-release .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Unit tests with helm-unittest
unit-tests:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache python3 py3-pip helm
    - pip3 install helm-unittest
  script:
    - helm unittest --strict -f "tests/*.yaml" .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# Test with example values
test-examples:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache helm
  script:
    - echo "Testing with Plex example..."
    - helm template test-release . -f examples/plex.yaml --debug
    - echo "Testing with Radarr example..."
    - helm template test-release . -f examples/radarr.yaml --debug
    - echo "Testing with Sonarr example..."
    - helm template test-release . -f examples/sonarr.yaml --debug
    - echo "Testing with Tautulli example..."
    - helm template test-release . -f examples/tautulli.yaml --debug
    - echo "Testing with Deluge example..."
    - helm template test-release . -f examples/deluge.yaml --debug
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Integration testing with chart-testing
integration-test:
  stage: test
  image: quay.io/helmpack/chart-testing:v3.9.0
  script:
    - ct lint --all
    - ct install --all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.tpl"
        - "Chart.yaml"
        - "values.yaml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.tpl"
        - "Chart.yaml"
        - "values.yaml"
  allow_failure: true

# Package the chart
package:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache helm
  script:
    - helm package .
    - ls -la *.tgz
  artifacts:
    paths:
      - "*.tgz"
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy to GitLab Container Registry
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl helm
    - helm registry login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - helm package .
    - CHART_FILE=$(ls *.tgz)
    - helm push $CHART_FILE oci://$CI_REGISTRY/helm
    - echo "Chart deployed successfully to GitLab Container Registry"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  dependencies:
    - package