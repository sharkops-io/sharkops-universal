stages:
  - lint
  - test
  - package
  - deploy

variables:
  CHART_NAME: "sharkops-universal"

# Reusable job templates
.helm_base: &helm_base
  image: alpine:latest
  before_script:
    - apk add --no-cache helm

.helm_with_curl: &helm_with_curl
  image: alpine:latest
  before_script:
    - apk add --no-cache helm curl git

.helm_with_docker: &helm_with_docker
  image: alpine:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
  before_script:
    - apk add --no-cache helm curl bash docker-cli
    - curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - sleep 10
    - docker info
    - k3d cluster create test-cluster --port "8080:80@loadbalancer"
    - export KUBECONFIG=$(k3d kubeconfig write test-cluster)
    - export PATH=$PATH:/usr/local/bin
    - kubectl cluster-info

.standard_rules: &standard_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.chart_changes_rules: &chart_changes_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.tpl"
        - "Chart.yaml"
        - "values.yaml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.tpl"
        - "Chart.yaml"
        - "values.yaml"

# Lint and test the chart
lint:
  <<: *helm_base
  stage: lint
  script:
    - helm lint .
    - helm template test-release . --debug
  <<: *standard_rules

# Unit tests with helm-unittest
unit-tests:
  <<: *helm_with_curl
  stage: test
  script:
    - helm plugin install https://github.com/helm-unittest/helm-unittest
    - helm unittest --strict -f "tests/*.yaml" .
  <<: *standard_rules

# Test with example values and new features
test-examples:
  <<: *helm_base
  stage: test
  script:
    - echo "=== Testing All Examples and New Features ==="
    - echo "🧪 Testing all example configurations..."
    - for example in examples/*.yaml; do
        echo "Testing $(basename $example)...";
        helm template test-release . -f "$example" --debug > /dev/null;
        echo "✅ $(basename $example) PASSED";
      done
    - echo "🔍 Testing new features..."
    - echo "1. Testing restructured PVC configuration..."
    - helm template test-release . --set persistence.enabled=true | grep -A 5 "PersistentVolumeClaim" | head -20
    - echo "✅ PVC restructuring working"
    - echo "2. Testing existing PVC support..."
    - helm template test-release . -f examples/existing-pvc.yaml | grep -c "PersistentVolumeClaim" || echo "0"
    - echo "✅ Existing PVC support working (0 PVCs created)"
    - echo "3. Testing environment variables from ConfigMaps/Secrets..."
    - helm template test-release . -f examples/simple-env.yaml | grep -A 5 "configMapRef\|secretKeyRef"
    - echo "✅ Environment variables from ConfigMaps/Secrets working"
    - echo "4. Testing envFrom syntax..."
    - helm template test-release . -f examples/envfrom.yaml | grep -A 10 "envFrom:"
    - echo "✅ envFrom syntax working"
    - echo "5. Testing secret mounts..."
    - helm template test-release . -f examples/env-secrets.yaml | grep -A 5 "ssl-certs\|config-files"
    - echo "✅ Secret mounts working"
    - echo "6. Testing comprehensive env/secrets example..."
    - helm template test-release . -f examples/env-secrets.yaml > /dev/null
    - echo "✅ Comprehensive env/secrets example working"
    - echo "7. Testing backward compatibility..."
    - helm template test-release . -f examples/tautulli.yaml > /dev/null
    - echo "✅ Backward compatibility maintained"
    - echo "🎉 All examples and new features tested successfully!"
  <<: *standard_rules

# Test with local Kubernetes cluster using k3d
test-with-cluster:
  <<: *helm_with_docker
  stage: test
  script:
    - export PATH=$PATH:/usr/local/bin
    - helm lint .
    - helm template test-release . --debug
    - helm install --dry-run --debug test-release . --set image.repository=nginxinc/nginx-unprivileged --set image.tag=alpine --set 'service.ports[0].port=8080' --set 'service.ports[0].targetPort=8080' --set 'livenessProbe.httpGet.port=8080' --set 'readinessProbe.httpGet.port=8080'
    - helm install test-release . --wait --timeout=5m --set image.repository=nginxinc/nginx-unprivileged --set image.tag=alpine --set 'service.ports[0].port=8080' --set 'service.ports[0].targetPort=8080' --set 'livenessProbe.httpGet.port=8080' --set 'readinessProbe.httpGet.port=8080'
    - kubectl get all
    - helm uninstall test-release
  after_script:
    - k3d cluster delete test-cluster || true
  <<: *standard_rules

# Integration testing with chart-testing
integration-test:
  stage: test
  image: quay.io/helmpack/chart-testing:v3.9.0
  script:
    - ct lint --all
    - ct install --all
  <<: *chart_changes_rules

# Package the chart
package:
  <<: *helm_base
  stage: package
  script:
    - helm package .
    - ls -la *.tgz
  artifacts:
    paths:
      - "*.tgz"
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy to GitLab Container Registry (OCI)
deploy:
  <<: *helm_base
  stage: deploy
  before_script:
    - apk add --no-cache curl helm
  script:
    - helm package . --version $CI_COMMIT_TAG
    - CHART_FILE=$(ls *.tgz)
    - echo "Pushing chart to GitLab Container Registry (OCI)..."
    - helm push $CHART_FILE oci://registry.gitlab.com/sharkops/helm-charts/sharkops-universal
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - package