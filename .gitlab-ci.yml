stages:
  - lint
  - test
  - package
  - deploy

variables:
  CHART_NAME: "linuxserver-universal"

# Lint and test the chart
lint:
  stage: lint
  image: alpine:latest
  before_script:
    - apk add --no-cache helm
  script:
    - helm lint .
    - helm template test-release . --debug
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test with local Kubernetes cluster using k3d
test-with-cluster:
  stage: test
  image: alpine:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
  before_script:
    - apk add --no-cache helm curl bash docker-cli
    - curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - sleep 10
    - docker info
    - k3d cluster create test-cluster --port "8080:80@loadbalancer"
    - export KUBECONFIG=$(k3d kubeconfig write test-cluster)
    - export PATH=$PATH:/usr/local/bin
    - kubectl cluster-info
  script:
    - export PATH=$PATH:/usr/local/bin
    - helm lint .
    - helm template test-release . --debug
    - helm install --dry-run --debug test-release . --set image.repository=nginx --set image.tag=alpine
    - helm install test-release . --wait --timeout=5m --set image.repository=nginx --set image.tag=alpine
    - kubectl get all
    - helm uninstall test-release
  after_script:
    - k3d cluster delete test-cluster || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Unit tests with helm-unittest
unit-tests:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache helm curl git
    - helm plugin install https://github.com/helm-unittest/helm-unittest
  script:
    - helm unittest --strict -f "tests/*.yaml" .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test with example values
test-examples:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache helm
  script:
    - echo "Testing with Plex example..."
    - helm template test-release . -f examples/plex.yaml --debug
    - echo "Testing with Radarr example..."
    - helm template test-release . -f examples/radarr.yaml --debug
    - echo "Testing with Sonarr example..."
    - helm template test-release . -f examples/sonarr.yaml --debug
    - echo "Testing with Tautulli example..."
    - helm template test-release . -f examples/tautulli.yaml --debug
    - echo "Testing with Deluge example..."
    - helm template test-release . -f examples/deluge.yaml --debug
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Integration testing with chart-testing
integration-test:
  stage: test
  image: quay.io/helmpack/chart-testing:v3.9.0
  script:
    - ct lint --all
    - ct install --all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.tpl"
        - "Chart.yaml"
        - "values.yaml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.tpl"
        - "Chart.yaml"
        - "values.yaml"

# Package the chart
package:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache helm
  script:
    - helm package .
    - ls -la *.tgz
  artifacts:
    paths:
      - "*.tgz"
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy to GitLab Container Registry
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl helm
    - helm registry login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - helm package . --version $CI_COMMIT_TAG
    - CHART_FILE=$(ls *.tgz)
    - helm push $CHART_FILE oci://$CI_REGISTRY/helm
    - echo "Chart deployed successfully to GitLab Container Registry"
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - package