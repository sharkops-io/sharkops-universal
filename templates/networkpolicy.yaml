{{/*
Ingress only. Phase 2 (egress) will add a SIBLING CiliumNetworkPolicy template,
not an egress block here: vanilla NetworkPolicy egress can only express CIDRs,
and outbound traffic here is mostly to named hosts on rotating IPs, which needs
Cilium toFQDNs. The two coexist and are additive per direction.
See example-org/talos docs/2026-08-15-network-policy-default-deny-design.md.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.labels.selectorLabels" . | nindent 6 }}
      {{- with .Values.networkPolicy.extraPodSelectorLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  # Ingress ONLY. Adding Egress here silently breaks DNS for this release.
  policyTypes:
    - Ingress
  {{- $hasRules := or .Values.networkPolicy.allowPrometheus .Values.networkPolicy.allowIngressController .Values.networkPolicy.extraIngress }}
  # An explicit [] when there are no rules. Kubernetes treats a null ingress
  # and an empty one identically, but `ingress: []` reads as "deny everything,
  # deliberately" where a bare key reads as "someone forgot to fill this in".
  ingress:{{ if not $hasRules }} []{{ end }}
    {{- if .Values.networkPolicy.allowPrometheus }}
    # Without this the namespace is simply never scraped: the target goes
    # down, the metric vanishes, and nothing else reports a problem.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    {{- end }}
    {{- if .Values.networkPolicy.allowIngressController }}
    # Cilium ingress traffic arrives from the node. Cilium's allow-localhost
    # default covers host->pod, so this may be redundant; the pilot app task
    # settles whether it is required before this is rolled out widely.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
