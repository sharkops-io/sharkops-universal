{{- range .Values.additionalIngresses }}
{{- if .enabled }}
{{- $port := .port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common.names.fullname" $ }}-{{ .name }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .className }}
  ingressClassName: {{ .className }}
  {{- end }}
  {{- if .tls }}
  tls:
    {{- range .tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- $portConfig := dict }}
                {{- range $.Values.service.ports }}
                {{- if or (and (kindIs "string" $port) (eq .name $port)) (and (kindIs "int" $port) (eq .port $port)) }}
                {{- $_ := set $portConfig "found" true }}
                {{- $_ := set $portConfig "serviceName" (printf "%s-%s" (include "common.names.fullname" $) (.type | default $.Values.service.type | lower)) }}
                {{- $_ := set $portConfig "port" . }}
                {{- end }}
                {{- end }}
                {{- if $portConfig.found }}
                name: {{ $portConfig.serviceName }}
                port:
                  {{- if kindIs "string" $port }}
                  name: {{ $port }}
                  {{- else }}
                  number: {{ $port }}
                  {{- end }}
                {{- else }}
                name: {{ include "common.names.fullname" $ }}-{{ $.Values.service.type | lower }}
                port:
                  number: 80
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
