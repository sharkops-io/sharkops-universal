{{- /*
This template renders EITHER a Deployment or a DaemonSet from one pod spec.
The pod template below is shared verbatim; only the three controller-level
fields differ (replicas/strategy vs updateStrategy).

The validation here exists because the alternative is the chart's worst
failure mode: a values key that renders cleanly and then means nothing.
`replicas: 3` under a DaemonSet, or `type: Recreate`, would both be dropped
on the floor by a template that simply branched on kind -- the release would
deploy and quietly not be what the values say. Each is a render error instead.
*/}}
{{- $kind := .Values.kind | default "Deployment" }}
{{- if not (has $kind (list "Deployment" "DaemonSet")) }}
{{- fail (printf "sharkops-universal: kind must be Deployment or DaemonSet, got %q" $kind) }}
{{- end }}
{{- $isDaemonSet := eq $kind "DaemonSet" }}
{{- $rollout := ternary .Values.updateStrategy .Values.strategy $isDaemonSet }}
{{- if $isDaemonSet }}
{{- if ne (int (.Values.replicas | default 1)) 1 }}
{{- fail (printf "sharkops-universal: replicas (%v) has no meaning for kind: DaemonSet -- one pod per matching node is the definition. Use nodeSelector/affinity to choose nodes." .Values.replicas) }}
{{- end }}
{{- if not (has $rollout.type (list "RollingUpdate" "OnDelete")) }}
{{- fail (printf "sharkops-universal: updateStrategy.type must be RollingUpdate or OnDelete for a DaemonSet, got %q (Recreate is Deployment-only)" $rollout.type) }}
{{- end }}
{{- /*
apps/v1: "may not be set to a non-zero value when maxSurge is non-zero".
values.yaml defaults to the legal 1/0, so this only fires when a consumer
copies a Deployment's 1/1 across -- which would otherwise render fine and be
rejected by the API server at apply time.
*/}}
{{- if and (eq $rollout.type "RollingUpdate") (ne (int $rollout.rollingUpdate.maxUnavailable) 0) (ne (int $rollout.rollingUpdate.maxSurge) 0) }}
{{- fail (printf "sharkops-universal: a DaemonSet may not set both updateStrategy.rollingUpdate.maxUnavailable (%v) and maxSurge (%v) non-zero -- apps/v1 rejects it. Set one of them to 0." $rollout.rollingUpdate.maxUnavailable $rollout.rollingUpdate.maxSurge) }}
{{- end }}
{{- else }}
{{- if not (has $rollout.type (list "RollingUpdate" "Recreate")) }}
{{- fail (printf "sharkops-universal: strategy.type must be RollingUpdate or Recreate for a Deployment, got %q (OnDelete is DaemonSet-only)" $rollout.type) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ include "common.names.deploymentName" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  {{- /*
  On the controller object (Deployment or DaemonSet), deliberately NOT on the
  pod template (that is podAnnotations). Reloader reads reloader.stakater.com/*
  from the controller, so putting them on the pod template silently does
  nothing.
  */}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $isDaemonSet }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{ if $isDaemonSet }}updateStrategy{{ else }}strategy{{ end }}:
    type: {{ $rollout.type }}
    {{- /*
    rollingUpdate ONLY under type RollingUpdate. apps/v1 rejects the field
    alongside type Recreate ("Present only if DeploymentStrategyType =
    RollingUpdate") and alongside a DaemonSet's OnDelete, and values.yaml
    always supplies rollingUpdate defaults -- so emitting it unconditionally
    made `type: Recreate` inexpressible: it rendered cleanly and then failed at
    apply. A single-replica ReadWriteOnce release wanting no pod overlap had to
    spell it `maxSurge: 0` instead.
    */}}
    {{- if eq $rollout.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ $rollout.rollingUpdate.maxUnavailable }}
      maxSurge: {{ $rollout.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /*
      Roll the pod when config it MOUNTS changes.

      A ConfigMap or Secret shipped through extraObjects can change without the
      Deployment changing at all - the apply succeeds, nothing restarts, and the
      container keeps serving the old file indefinitely. Hashing those objects
      into a pod annotation makes the pod template change with them.

      Only ConfigMap and Secret are hashed: a NetworkPolicy or PVC in
      extraObjects has no bearing on what the container has loaded, and rolling
      the pod for it would be noise. Env vars need no checksum - they live in
      the pod spec already.

      Caveat: the hash covers the values as written, before extra-objects.yaml
      runs `tpl` over them. A change that only materialises through templating
      (e.g. a referenced value used inside the object) will not move the hash.
      */}}
      {{- $configObjects := list }}
      {{- range .Values.extraObjects }}
        {{- $kind := .kind | default "" }}
        {{- if or (eq $kind "ConfigMap") (eq $kind "Secret") }}
          {{- $configObjects = append $configObjects . }}
        {{- end }}
      {{- end }}
      {{- if or $configObjects .Values.podAnnotations }}
      annotations:
        {{- if $configObjects }}
        checksum/extra-config: {{ toYaml $configObjects | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "common.labels.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      {{- /*
      Rendered ONLY when explicitly false, never when true.

      Kubernetes defaults this to true, and the API server materialises it on
      the POD -- but not on the Deployment's pod TEMPLATE, which is what the
      pod-template hash is computed from. So emitting `enableServiceLinks: true`
      would change the template of every existing consumer and roll all of them
      for no behavioural difference. Verified against live objects before
      choosing this shape.

      Setting it explicitly to true therefore renders nothing, which is correct:
      absent and true mean the same thing to Kubernetes.
      */}}
      {{- if and (kindIs "bool" .Values.enableServiceLinks) (not .Values.enableServiceLinks) }}
      enableServiceLinks: false
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "common.names.appName" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /*
          Container-level, distinct from the pod-level .Values.securityContext
          above. The two are not interchangeable: runAsUser/fsGroup are pod
          fields, while allowPrivilegeEscalation, capabilities and
          readOnlyRootFilesystem exist ONLY here -- so without this key a
          workload could not drop capabilities at all, and PodSecurity's
          baseline/restricted checks that name those fields could never be
          satisfied. Empty by default, so it renders nothing for every existing
          consumer.
          */}}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range $key, $value := .Values.env.values }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.env.configMaps }}
            {{- if .keys }}
            {{- $configMapName := .name }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName }}
                  key: {{ . }}
            {{- end }}
            {{- else }}
            - name: {{ .name }}
              valueFrom:
                configMapRef:
                  name: {{ .name }}
            {{- end }}
            {{- end }}
            {{- /*
            Explicit ENV-NAME -> secret/key mapping. `env.secrets` below can
            only produce an env var whose name IS the secret key, which cannot
            express the common case of a credential generated by an operator:
            CloudNativePG writes `password` into <cluster>-app, and the app
            wants it as e.g. VIKUNJA_DATABASE_PASSWORD. Before this key the
            only ways out were an `envFrom` that dumps every key of the secret
            into the environment under the operator's names, or wrapping the
            image's entrypoint in a shell to re-export it.
            */}}
            {{- range .Values.env.secretRefs }}
            {{- if not (and .name .secret .key) }}
            {{- fail (printf "sharkops-universal: every env.secretRefs entry needs name, secret and key -- got %v" .) }}
            {{- end }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ .key }}
            {{- end }}
            {{- range .Values.env.secrets }}
            {{- if .keys }}
            {{- $secretName := .name }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- else }}
            - name: {{ .name }}
              valueFrom:
                secretRef:
                  name: {{ .name }}
            {{- end }}
            {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          {{- /*
          Guarded: a workload with no Service (`service.ports: []`, the normal
          shape for a node daemon) previously rendered a bare `ports:` key,
          i.e. `ports: null`.
          */}}
          {{- with .Values.service.ports }}
          ports:
            {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- end }}
          {{- /*
          Probe paths/ports resolve per-probe first, then fall back to the
          shared .Values.healthCheck. `| default dict` guards against a
          consumer setting `httpGet: null` outright, which would otherwise be
          a nil-pointer at render time.
          */}}
          {{- $liveness := .Values.livenessProbe.httpGet | default dict }}
          {{- $readiness := .Values.readinessProbe.httpGet | default dict }}
          {{- if and .Values.healthCheck.enabled .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $liveness.path | default .Values.healthCheck.path }}
              port: {{ $liveness.port | default .Values.healthCheck.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if and .Values.healthCheck.enabled .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $readiness.path | default .Values.healthCheck.path }}
              port: {{ $readiness.port | default .Values.healthCheck.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: config
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- range .Values.persistence.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
            {{- end }}
            {{- range .Values.secretMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              {{- if .defaultMode }}
              defaultMode: {{ .defaultMode }}
              {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.oauth2proxy.enabled }}
        - name: oauth2-proxy
          image: "{{ .Values.oauth2proxy.image.repository }}:{{ .Values.oauth2proxy.image.tag }}"
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ required "oauth2proxy.issuerUrl is required when oauth2proxy.enabled is true" .Values.oauth2proxy.issuerUrl }}
            - --client-id={{ .Values.oauth2proxy.clientId }}
            - --redirect-url={{ .Values.oauth2proxy.redirectUrl }}
            - --upstream=http://localhost:{{ (index .Values.service.ports 0).targetPort }}
            - --http-address=[::]:4180
            - --email-domain=*
            {{- with .Values.oauth2proxy.cookieDomain }}
            - --cookie-domain={{ . }}
            - --whitelist-domain={{ . }}
            {{- end }}
            - --cookie-secure=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --pass-host-header=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2proxy.existingSecret }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2proxy.existingSecret }}
                  key: cookie-secret
          ports:
            - name: oauth2-proxy
              containerPort: 4180
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 2
            periodSeconds: 5
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "common.names.fullname" .) }}
        {{- end }}
        {{- range .Values.persistence.volumes }}
        {{- if and .persistence .persistence.enabled }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .persistence.existingClaim | default (printf "%s-%s" (include "common.names.fullname" $) .name) }}
        {{- end }}
        {{- end }}
        {{- range .Values.secretMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
            {{- if .defaultMode }}
            defaultMode: {{ .defaultMode }}
            {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
