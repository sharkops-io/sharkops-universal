apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.deploymentName" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  {{- /*
  On the Deployment, deliberately NOT on the pod template (that is
  podAnnotations). Reloader reads reloader.stakater.com/* from the Deployment
  object, so putting them on the pod template silently does nothing.
  */}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- /*
    rollingUpdate ONLY under type RollingUpdate. apps/v1 rejects the field
    alongside type Recreate ("Present only if DeploymentStrategyType =
    RollingUpdate"), and values.yaml always supplies rollingUpdate defaults --
    so emitting it unconditionally made `type: Recreate` inexpressible: it
    rendered cleanly and then failed at apply. A single-replica ReadWriteOnce
    release wanting no pod overlap had to spell it `maxSurge: 0` instead.
    */}}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /*
      Roll the pod when config it MOUNTS changes.

      A ConfigMap or Secret shipped through extraObjects can change without the
      Deployment changing at all - the apply succeeds, nothing restarts, and the
      container keeps serving the old file indefinitely. Hashing those objects
      into a pod annotation makes the pod template change with them.

      Only ConfigMap and Secret are hashed: a NetworkPolicy or PVC in
      extraObjects has no bearing on what the container has loaded, and rolling
      the pod for it would be noise. Env vars need no checksum - they live in
      the pod spec already.

      Caveat: the hash covers the values as written, before extra-objects.yaml
      runs `tpl` over them. A change that only materialises through templating
      (e.g. a referenced value used inside the object) will not move the hash.
      */}}
      {{- $configObjects := list }}
      {{- range .Values.extraObjects }}
        {{- $kind := .kind | default "" }}
        {{- if or (eq $kind "ConfigMap") (eq $kind "Secret") }}
          {{- $configObjects = append $configObjects . }}
        {{- end }}
      {{- end }}
      {{- if or $configObjects .Values.podAnnotations }}
      annotations:
        {{- if $configObjects }}
        checksum/extra-config: {{ toYaml $configObjects | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "common.labels.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "common.names.appName" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range $key, $value := .Values.env.values }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.env.configMaps }}
            {{- if .keys }}
            {{- $configMapName := .name }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName }}
                  key: {{ . }}
            {{- end }}
            {{- else }}
            - name: {{ .name }}
              valueFrom:
                configMapRef:
                  name: {{ .name }}
            {{- end }}
            {{- end }}
            {{- range .Values.env.secrets }}
            {{- if .keys }}
            {{- $secretName := .name }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- else }}
            - name: {{ .name }}
              valueFrom:
                secretRef:
                  name: {{ .name }}
            {{- end }}
            {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- /*
          Probe paths/ports resolve per-probe first, then fall back to the
          shared .Values.healthCheck. `| default dict` guards against a
          consumer setting `httpGet: null` outright, which would otherwise be
          a nil-pointer at render time.
          */}}
          {{- $liveness := .Values.livenessProbe.httpGet | default dict }}
          {{- $readiness := .Values.readinessProbe.httpGet | default dict }}
          {{- if and .Values.healthCheck.enabled .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $liveness.path | default .Values.healthCheck.path }}
              port: {{ $liveness.port | default .Values.healthCheck.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if and .Values.healthCheck.enabled .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $readiness.path | default .Values.healthCheck.path }}
              port: {{ $readiness.port | default .Values.healthCheck.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: config
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- range .Values.persistence.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
            {{- end }}
            {{- range .Values.secretMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              {{- if .defaultMode }}
              defaultMode: {{ .defaultMode }}
              {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.oauth2proxy.enabled }}
        - name: oauth2-proxy
          image: "{{ .Values.oauth2proxy.image.repository }}:{{ .Values.oauth2proxy.image.tag }}"
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.oauth2proxy.issuerUrl }}
            - --client-id={{ .Values.oauth2proxy.clientId }}
            - --redirect-url={{ .Values.oauth2proxy.redirectUrl }}
            - --upstream=http://localhost:{{ (index .Values.service.ports 0).targetPort }}
            - --http-address=[::]:4180
            - --email-domain=*
            - --cookie-domain={{ .Values.oauth2proxy.cookieDomain }}
            - --whitelist-domain={{ .Values.oauth2proxy.cookieDomain }}
            - --cookie-secure=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --pass-host-header=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2proxy.existingSecret }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2proxy.existingSecret }}
                  key: cookie-secret
          ports:
            - name: oauth2-proxy
              containerPort: 4180
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 2
            periodSeconds: 5
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "common.names.fullname" .) }}
        {{- end }}
        {{- range .Values.persistence.volumes }}
        {{- if and .persistence .persistence.enabled }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .persistence.existingClaim | default (printf "%s-%s" (include "common.names.fullname" $) .name) }}
        {{- end }}
        {{- end }}
        {{- range .Values.secretMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
            {{- if .defaultMode }}
            defaultMode: {{ .defaultMode }}
            {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
