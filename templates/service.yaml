{{- $defaultType := .Values.service.type }}
{{- $services := dict }}
{{- range .Values.service.ports }}
{{- $portType := .type | default $defaultType }}
{{- $serviceName := .serviceName | default (include "common.names.fullname" $) }}
{{- if not (hasKey $services $serviceName) }}
{{- $_ := set $services $serviceName (dict "type" $portType "ports" list) }}
{{- end }}
{{- $service := index $services $serviceName }}
{{- $_ := set $service "ports" (append $service.ports .) }}
{{- end }}
{{- range $serviceName, $service := $services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type }}
  {{- if $.Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ $.Values.service.ipFamilyPolicy }}
  {{- end }}
  {{- with $.Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- range $index, $port := $service.ports }}
    - name: {{ $port.name }}
      port: {{ $port.port }}
      {{- if and (eq $index 0) $.Values.oauth2proxy.enabled }}
      targetPort: 4180
      {{- else }}
      targetPort: {{ $port.targetPort }}
      {{- end }}
      protocol: {{ $port.protocol }}
    {{- end }}
  selector:
    {{- include "common.labels.selectorLabels" $ | nindent 4 }}
{{- end }}
