{{- /*
ExternalSecret objects, one per entry in .Values.externalSecrets.

These deliberately live in the CHART rather than in an app's before.yaml.
before.yaml is applied by `kubectl apply` BEFORE `helmfile apply`, which leaves
a window where the Deployment exists and references a Secret that ESO has not
materialised yet - the pod sits in CreateContainerConfigError, and `helm --wait`
can time out on it. Rendering them here puts both objects in the same release.

apiVersion is external-secrets.io/v1 and NOT v1beta1. ESO 2.x still ships the
v1beta1 CRD versions but marks them served: false, so a v1beta1 manifest is
REJECTED by the API server rather than converted. Most documentation and blog
posts online are still v1beta1.
*/ -}}
{{- range .Values.externalSecrets }}
{{- /*
`secretStoreRef` and `target` are optional, and a Go template cannot traverse a
nil map even when the leaf has a `default` - `.secretStoreRef.name` raises
"nil pointer evaluating interface {}.name" rather than falling back. Coercing
to an empty dict first makes the defaults actually reachable, which matters
because the no-override case is the common one.
*/ -}}
{{- $store := .secretStoreRef | default dict }}
{{- $target := .target | default dict }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $store.name | default "openbao" }}
    kind: {{ $store.kind | default "ClusterSecretStore" }}
  target:
    # The generated Secret takes the ExternalSecret's own name unless overridden,
    # so an app migrating off a hand-written Secret keeps the same Secret name
    # and needs no changes to env.secrets / envFrom / secretMounts.
    name: {{ $target.name | default .name }}
    creationPolicy: {{ $target.creationPolicy | default "Owner" }}
    {{- with $target.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if .dataFrom }}
  # dataFrom: every key at the remote path becomes a key in the Secret. Use this
  # when the app wants the whole path; it means adding a key in OpenBao does not
  # require a chart change.
  dataFrom:
    {{- range .dataFrom }}
    - extract:
        key: {{ .key }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- if .data }}
  # data: explicit per-key mapping, for when the Secret's key names must differ
  # from the names in OpenBao (e.g. an app that insists on UP_UNIFI_DEFAULT_PASS).
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- with .remoteRef.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
