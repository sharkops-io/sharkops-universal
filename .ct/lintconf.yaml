# Chart Testing Lint Configuration
strict: true
warnings:
  - missingChartVersion
  - missingMaintainers
  - deprecatedApiVersions
  - missingTestFiles
  - missingValuesFile
  - badChartType
  - invalidChartName
  - invalidMaintainerName
  - invalidMaintainerEmail
  - missingChartDescription
  - invalidChartHome
  - invalidChartSources
  - invalidChartKeywords
  - invalidChartAnnotations
  - invalidChartDependencies
