# Default values for sharkops-universal
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Chart metadata
nameOverride: ""
fullnameOverride: ""

# Image settings
image:
  repository: ""  # Override this for specific images
  tag: ""         # Override this for specific tags
  pullPolicy: IfNotPresent
  pullSecrets: []

# Deployment settings
replicas: 1
revisionHistoryLimit: 1  # Number of old ReplicaSets to keep for rollbacks
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1  # Maximum number of pods that can be unavailable during update
    maxSurge: 1        # Maximum number of pods that can be created above desired count

# Service settings
service:
  type: ClusterIP  # Default type for ports that don't specify their own
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      # type: ClusterIP  # Optional: override default service type for this port
      # serviceName: "custom-service-name"  # Optional: override service name for this port
  annotations: {}
  # Dual-stack settings (optional)
  # ipFamilyPolicy: SingleStack | PreferDualStack | RequireDualStack
  # ipFamilies: [IPv4, IPv6]

# Ingress settings
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
          # serviceName: "custom-service"  # Optional: use different service
          # servicePort: 8080               # Optional: use different port
  tls: []

# Additional ingress resources for other ports
additionalIngresses: []
  # Example:
  # - name: daemon
  #   enabled: true
  #   className: "nginx"
  #   annotations:
  #     cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #   hosts:
  #     - host: deluge-daemon.example.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #   tls:
  #     - secretName: deluge-daemon-tls
  #       hosts:
  #         - deluge-daemon.example.com
  #   port: 58846  # Port name or number to route to

# LoadBalancer services for additional ports
loadBalancers: []
  # Example (single port):
  # - name: daemon
  #   enabled: true
  #   port: 58846
  #   targetPort: 58846
  #   protocol: TCP
  #   annotations:
  #     service.beta.kubernetes.io/aws-load-balancer-type: nlb
  #
  # Example (with specific IP for MetalLB):
  # - name: external
  #   enabled: true
  #   port: 8080
  #   targetPort: 8080
  #   protocol: TCP
  #   loadBalancerIP: 192.168.1.100
  #   externalTrafficPolicy: Local
  #   annotations:
  #     metallb.universe.tf/address-pool: production
  #
  # Example (with Cluster traffic policy):
  # - name: cluster-wide
  #   enabled: true
  #   port: 9090
  #   targetPort: 9090
  #   protocol: TCP
  #   externalTrafficPolicy: Cluster
  #
  # Example (multiple protocols on same port):
  # - name: multi-protocol
  #   enabled: true
  #   ports:
  #     - name: tcp-8080
  #       port: 8080
  #       targetPort: 8080
  #       protocol: TCP
  #     - name: udp-8080
  #       port: 8080
  #       targetPort: 8080
  #       protocol: UDP
  #
  # Example (dual-stack IPv4+IPv6):
  # - name: external
  #   enabled: true
  #   port: 8080
  #   targetPort: 8080
  #   protocol: TCP
  #   ipFamilyPolicy: PreferDualStack
  #   ipFamilies:
  #     - IPv4
  #     - IPv6

# Persistence settings
persistence:
  enabled: false  # Disabled by default for generic deployments
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /config
  # existingClaim: ""  # Use existing PVC instead of creating new one
  
  # Additional volumes with optional persistent storage
  # Each volume can have its own persistence configuration
  # Leave empty for deployments that don't need additional volumes
  volumes: []
  
  # Example: How to add additional volumes
  # volumes:
  #   - name: downloads
  #     mountPath: /downloads
  #     subPath: ""
  #     persistence:
  #       enabled: true
  #       size: 10Gi
  #       storageClass: "fast-ssd"
  #       accessMode: ReadWriteOnce
  #       # existingClaim: "my-existing-downloads-pvc"  # Use existing PVC instead
  #   - name: media
  #     mountPath: /media
  #     subPath: ""
  #     persistence:
  #       enabled: true
  #       size: 50Gi
  #       storageClass: "fast-ssd"
  #       accessMode: ReadWriteOnce
  #       # existingClaim: "my-existing-media-pvc"  # Use existing PVC instead

# Security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Resources
# Uncomment and adjust as needed for your workload
# resources:
#   limits:
#     cpu: 500m
#     memory: 512Mi
#   requests:
#     cpu: 100m
#     memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Health checks and probes
# These are generic Kubernetes health check configurations
healthCheck:
  enabled: true
  path: /
  port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Liveness probe configuration
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Environment variables and secrets management
# This section allows you to manage environment variables from multiple sources
env:
  # Direct environment variables (key-value pairs)
  # These will be set directly in the container
  values:
    # default environment variables
    PUID: 1000
    PGID: 1000
    TZ: UTC
    # Add more environment variables as needed
    # Example:
    # LOG_LEVEL: "info"
    # DEBUG: "true"

  # Environment variables from ConfigMaps
  # Each entry can reference a ConfigMap and optionally specific keys
  configMaps: []
    # Example:
    # - name: "app-config"  # ConfigMap name
    #   keys: ["LOG_LEVEL", "DEBUG"]  # Optional: specific keys to include
    # - name: "global-config"  # If no keys specified, all keys are included

  # Environment variables from Secrets
  # Each entry can reference a Secret and optionally specific keys
  secrets: []
    # Example:
    # - name: "app-secrets"  # Secret name
    #   keys: ["DB_PASSWORD", "API_KEY"]  # Optional: specific keys to include
    # - name: "global-secrets"  # If no keys specified, all keys are included

# envFrom - Load all environment variables from ConfigMaps/Secrets
# This is the standard Kubernetes envFrom syntax
envFrom: []
  # Example:
  # - configMapRef:
  #     name: "app-config"
  # - secretRef:
  #     name: "app-secrets"
  # - configMapRef:
  #     name: "global-config"
  #     optional: true  # Optional: don't fail if ConfigMap doesn't exist

# Secret mounts
# Mount secrets as files instead of environment variables
secretMounts: []

# oauth2-proxy sidecar — adds authentication to any sharkops-universal app
#
# HOW TO ENABLE ON AN APP:
#   1. Create the credentials secret in the app's namespace (add to the app's EXTRA_MANIFEST_FILE):
#        apiVersion: v1
#        kind: Secret
#        metadata:
#          name: oauth2-proxy-credentials
#          namespace: <your-app-namespace>
#        stringData:
#          client-secret: "same value as authelia namespace"
#          cookie-secret: "same value as authelia namespace"
#   2. Add to the app's values.yaml:
#        oauth2proxy:
#          enabled: true
#          redirectUrl: https://yourapp.example.com/oauth2/callback
#   3. Add the app's callback URL to authelia/values.yaml under
#      configMap.identity_providers.oidc.clients[0].redirect_uris:
#        - https://yourapp.example.com/oauth2/callback
#
# NOTE: The ingress config does NOT change — keep pointing to the original service port.
# The sidecar intercepts traffic at the pod level (service targetPort → 4180 → app).
oauth2proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.9.0
  issuerUrl: https://auth.example.com
  clientId: oauth2-proxy
  redirectUrl: ""  # Required when enabled: https://yourapp.example.com/oauth2/callback
  cookieDomain: .example.com
  # Secret name in the app's namespace with keys: client-secret, cookie-secret
  existingSecret: oauth2-proxy-credentials
  # Example:
  # - name: "ssl-certs"
  #   secretName: "ssl-secret"
  #   mountPath: "/etc/ssl/certs"
  #   subPath: ""  # Optional: mount specific key as file
  #   defaultMode: 0400  # Optional: file permissions

