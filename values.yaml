# Default values for sharkops-universal
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Chart metadata
nameOverride: ""
fullnameOverride: ""

# Image settings
image:
  repository: ""  # Override this for specific images
  tag: ""         # Override this for specific tags
  pullPolicy: IfNotPresent
  pullSecrets: []

# Container entrypoint overrides. Both default to empty and render nothing, so
# every existing consumer is unaffected.
#
# Needed by images whose entrypoint is a multi-subcommand binary and cannot be
# steered by env alone - itzg/mc-monitor is FROM scratch with
# ENTRYPOINT ["/mc-monitor"] and requires `export-for-prometheus` as a
# POSITIONAL argument. Before 0.19.0 such an image rendered cleanly and then
# CrashLooped on a usage error.
command: []
args: []

# Deployment settings
replicas: 1
revisionHistoryLimit: 1  # Number of old ReplicaSets to keep for rollbacks
# type: RollingUpdate | Recreate
#
# Use Recreate for a single-replica app on a ReadWriteOnce volume: the default
# maxSurge: 1 starts the replacement pod before the old one is gone, and if the
# two land on different nodes the new pod blocks on Multi-Attach until the old
# attachment releases. The rollingUpdate block below is only rendered for type
# RollingUpdate, because apps/v1 rejects it alongside Recreate.
#
# `maxSurge: 0` under RollingUpdate is equivalent at replicas: 1 and is what
# releases pinned to an older chart version have to use.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1  # Maximum number of pods that can be unavailable during update
    maxSurge: 1        # Maximum number of pods that can be created above desired count

# Service settings
service:
  type: ClusterIP  # Default type for ports that don't specify their own
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      # type: ClusterIP  # Optional: override default service type for this port
      # serviceName: "custom-service-name"  # Optional: override service name for this port
  annotations: {}
  # Dual-stack settings (optional)
  # ipFamilyPolicy: SingleStack | PreferDualStack | RequireDualStack
  # ipFamilies: [IPv4, IPv6]

# ServiceMonitor for Prometheus Operator (kube-prometheus-stack).
# Requires the monitoring.coreos.com/v1 ServiceMonitor CRD to already exist in
# the cluster - enabling this without the operator installed will fail to apply.
serviceMonitor:
  enabled: false
  # Extra labels on the ServiceMonitor object itself. A Prometheus deployed by
  # kube-prometheus-stack only picks up ServiceMonitors matching its
  # serviceMonitorSelector, which defaults to `release: <prometheus-release-name>`.
  # That label is therefore usually REQUIRED, not decorative - without it the
  # object applies cleanly and is then silently ignored.
  labels: {}
  annotations: {}
  # Namespace to create the ServiceMonitor in. Empty = the release namespace.
  namespace: ""
  # Label on the scraped Service to use as the Prometheus `job` label.
  jobLabel: ""
  # Which namespaces to search for the matching Service. Empty = the
  # ServiceMonitor's own namespace.
  namespaceSelector: {}
  # Service labels to copy onto every scraped metric.
  targetLabels: []
  # Pod labels to copy onto every scraped metric.
  podTargetLabels: []
  # Scrape endpoints, passed through to the ServiceMonitor spec verbatim - so
  # any endpoint field the CRD supports (scheme, tlsConfig, bearerTokenSecret,
  # relabelings, metricRelabelings, ...) can be set here.
  # `port` must match a NAME in service.ports[], not a port number.
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

# Ingress settings
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
          # serviceName: "custom-service"  # Optional: use different service
          # servicePort: 8080               # Optional: use different port
  tls: []

# Additional ingress resources for other ports
additionalIngresses: []
  # Example:
  # - name: daemon
  #   enabled: true
  #   className: "nginx"
  #   annotations:
  #     cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #   hosts:
  #     - host: deluge-daemon.example.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #   tls:
  #     - secretName: deluge-daemon-tls
  #       hosts:
  #         - deluge-daemon.example.com
  #   port: 58846  # Port name or number to route to

# LoadBalancer services for additional ports
loadBalancers: []
  # Example (single port):
  # - name: daemon
  #   enabled: true
  #   port: 58846
  #   targetPort: 58846
  #   protocol: TCP
  #   annotations:
  #     service.beta.kubernetes.io/aws-load-balancer-type: nlb
  #
  # Example (with specific IP for MetalLB):
  # - name: external
  #   enabled: true
  #   port: 8080
  #   targetPort: 8080
  #   protocol: TCP
  #   loadBalancerIP: 192.168.1.100
  #   externalTrafficPolicy: Local
  #   annotations:
  #     metallb.universe.tf/address-pool: production
  #
  # Example (with Cluster traffic policy):
  # - name: cluster-wide
  #   enabled: true
  #   port: 9090
  #   targetPort: 9090
  #   protocol: TCP
  #   externalTrafficPolicy: Cluster
  #
  # Example (multiple protocols on same port):
  # - name: multi-protocol
  #   enabled: true
  #   ports:
  #     - name: tcp-8080
  #       port: 8080
  #       targetPort: 8080
  #       protocol: TCP
  #     - name: udp-8080
  #       port: 8080
  #       targetPort: 8080
  #       protocol: UDP
  #
  # Example (dual-stack IPv4+IPv6):
  # - name: external
  #   enabled: true
  #   port: 8080
  #   targetPort: 8080
  #   protocol: TCP
  #   ipFamilyPolicy: PreferDualStack
  #   ipFamilies:
  #     - IPv4
  #     - IPv6

# Persistence settings
persistence:
  enabled: false  # Disabled by default for generic deployments
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /config
  # existingClaim: ""  # Use existing PVC instead of creating new one
  
  # Additional volumes with optional persistent storage
  # Each volume can have its own persistence configuration
  # Leave empty for deployments that don't need additional volumes
  volumes: []
  
  # Example: How to add additional volumes
  # volumes:
  #   - name: downloads
  #     mountPath: /downloads
  #     subPath: ""
  #     persistence:
  #       enabled: true
  #       size: 10Gi
  #       storageClass: "fast-ssd"
  #       accessMode: ReadWriteOnce
  #       # existingClaim: "my-existing-downloads-pvc"  # Use existing PVC instead
  #   - name: media
  #     mountPath: /media
  #     subPath: ""
  #     persistence:
  #       enabled: true
  #       size: 50Gi
  #       storageClass: "fast-ssd"
  #       accessMode: ReadWriteOnce
  #       # existingClaim: "my-existing-media-pvc"  # Use existing PVC instead

# Security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Resources
# Uncomment and adjust as needed for your workload
# resources:
#   limits:
#     cpu: 500m
#     memory: 512Mi
#   requests:
#     cpu: 100m
#     memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Runtime class — set to "nvidia" when using the NVIDIA device plugin
runtimeClassName: ""

# Extra volumes injected into the pod spec (any Kubernetes volume type)
extraVolumes: []

# Extra volume mounts injected into the main container
extraVolumeMounts: []

# Health checks and probes
# These are generic Kubernetes health check configurations
# Shared HTTP endpoint for both probes. Most apps expose one health path and
# want liveness and readiness pointed at it - set it once here rather than
# twice below.
#
# `enabled: false` is the master switch: it drops BOTH probes, for apps with
# no HTTP endpoint to probe at all.
#
# NOTE: `port` is a port NAME from service.ports[], not a number.
#
# Timing lives on the individual probes, not here - liveness and readiness
# want different initialDelaySeconds, so a single shared value would be
# actively wrong. (Prior to 0.17.0 this block also carried
# initialDelaySeconds/periodSeconds/timeoutSeconds/failureThreshold keys.
# Nothing read them - nothing read ANY of this block - so they are gone
# rather than left to look meaningful.)
healthCheck:
  enabled: true
  path: /
  port: http

# Liveness probe configuration.
# httpGet.path / httpGet.port override healthCheck above for this probe only;
# leave them unset to inherit.
livenessProbe:
  enabled: true
  httpGet: {}
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration. Same override semantics as livenessProbe.
readinessProbe:
  enabled: true
  httpGet: {}
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Grafana dashboards shipped with the release, as ConfigMaps labelled for the
# kube-prometheus-stack Grafana sidecar to discover. Keeps a dashboard in the
# same repo and the same diff as the exporter whose metrics it queries.
#
# `dashboards` maps a name to the dashboard JSON as a STRING. In a helmfile
# values file use the .gotmpl extension and readFile, so the JSON stays a real,
# diffable file on disk:
#
#   grafanaDashboards:
#     enabled: true
#     dashboards:
#       my-app: |
#         {{ readFile "dashboards/my-app.json" | indent 8 | trim }}
#
# Each entry becomes its own ConfigMap named <release>-<key>, with the JSON
# under the data key <key>.json. The JSON is emitted verbatim - Grafana's
# {{label}} legendFormat syntax passes through untouched, which is exactly why
# this is not built on extraObjects (see templates/grafana-dashboards.yaml).
grafanaDashboards:
  enabled: false
  # The sidecar's watch label. Must match Grafana's LABEL / LABEL_VALUE env.
  label: grafana_dashboard
  labelValue: "1"
  # Extra labels/annotations on every dashboard ConfigMap. `grafana_folder`
  # is the usual reason to set labels here.
  labels: {}
  annotations: {}
  dashboards: {}

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC
rbac:
  clusterRole:
    # Set to true to create a ClusterRole and ClusterRoleBinding bound to the service account
    enabled: false
    rules: []
    # Example:
    # rules:
    #   - apiGroups: [""]
    #     resources: ["nodes", "pods"]
    #     verbs: ["get", "list", "watch"]

# Environment variables and secrets management
# This section allows you to manage environment variables from multiple sources
env:
  # Direct environment variables (key-value pairs)
  # These will be set directly in the container
  values:
    # default environment variables
    PUID: 1000
    PGID: 1000
    TZ: UTC
    # Add more environment variables as needed
    # Example:
    # LOG_LEVEL: "info"
    # DEBUG: "true"

  # Environment variables from ConfigMaps
  # Each entry can reference a ConfigMap and optionally specific keys
  configMaps: []
    # Example:
    # - name: "app-config"  # ConfigMap name
    #   keys: ["LOG_LEVEL", "DEBUG"]  # Optional: specific keys to include
    # - name: "global-config"  # If no keys specified, all keys are included

  # Environment variables from Secrets
  # Each entry can reference a Secret and optionally specific keys
  secrets: []
    # Example:
    # - name: "app-secrets"  # Secret name
    #   keys: ["DB_PASSWORD", "API_KEY"]  # Optional: specific keys to include
    # - name: "global-secrets"  # If no keys specified, all keys are included

# envFrom - Load all environment variables from ConfigMaps/Secrets
# This is the standard Kubernetes envFrom syntax
envFrom: []
  # Example:
  # - configMapRef:
  #     name: "app-config"
  # - secretRef:
  #     name: "app-secrets"
  # - configMapRef:
  #     name: "global-config"
  #     optional: true  # Optional: don't fail if ConfigMap doesn't exist

# Secret mounts
# Mount secrets as files instead of environment variables
secretMounts: []

# Extra annotations on the POD template (not the Deployment object).
# Note the chart also adds `checksum/extra-config` automatically whenever
# extraObjects contains a ConfigMap or Secret - see templates/deployment.yaml -
# so that changing mounted config actually rolls the pod instead of applying
# cleanly and leaving the old file loaded.
podAnnotations: {}

# Init containers, run to completion in order before the main container starts.
# Use standard Kubernetes container spec. Volumes defined under persistence are
# available to mount here via volumeMounts -- the config PVC is always named
# `config`, so an init container can prepare on-disk state the app then reads.
#
# Note these inherit the pod-level securityContext above (runAsUser 1000 by
# default), so they cannot write files owned by root unless that is overridden
# per-container.
initContainers: []
  # Example:
  # - name: seed-config
  #   image: busybox:1.37
  #   command: ["/bin/sh", "-c"]
  #   args:
  #     - test -f /config/app.conf || cp /defaults/app.conf /config/app.conf
  #   volumeMounts:
  #     - name: config
  #       mountPath: /config

# Extra sidecar containers injected into the pod alongside the main container.
# Use standard Kubernetes container spec. Volumes defined under persistence are
# available to mount here via volumeMounts.
extraContainers: []
  # Example:
  # - name: my-sidecar
  #   image: my-org/my-sidecar:latest
  #   ports:
  #     - containerPort: 9090
  #   env:
  #     - name: SOME_VAR
  #       value: "some-value"

# oauth2-proxy sidecar — adds authentication to any sharkops-universal app
#
# HOW TO ENABLE ON AN APP:
#   1. Create the credentials secret in the app's namespace (add to the app's EXTRA_MANIFEST_FILE):
#        apiVersion: v1
#        kind: Secret
#        metadata:
#          name: oauth2-proxy-credentials
#          namespace: <your-app-namespace>
#        stringData:
#          client-secret: "same value as authelia namespace"
#          cookie-secret: "same value as authelia namespace"
#   2. Add to the app's values.yaml:
#        oauth2proxy:
#          enabled: true
#          redirectUrl: https://yourapp.example.com/oauth2/callback
#   3. Add the app's callback URL to authelia/values.yaml under
#      configMap.identity_providers.oidc.clients[0].redirect_uris:
#        - https://yourapp.example.com/oauth2/callback
#
# NOTE: The ingress config does NOT change — keep pointing to the original service port.
# The sidecar intercepts traffic at the pod level (service targetPort → 4180 → app).
oauth2proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.9.0
  issuerUrl: https://auth.example.com
  clientId: oauth2-proxy
  redirectUrl: ""  # Required when enabled: https://yourapp.example.com/oauth2/callback
  cookieDomain: .example.com
  # Secret name in the app's namespace with keys: client-secret, cookie-secret
  existingSecret: oauth2-proxy-credentials
  # Example:
  # - name: "ssl-certs"
  #   secretName: "ssl-secret"
  #   mountPath: "/etc/ssl/certs"
  #   subPath: ""  # Optional: mount specific key as file
  #   defaultMode: 0400  # Optional: file permissions


# Extra arbitrary Kubernetes objects to render alongside the release.
# Each entry is a full Kubernetes manifest; go template expressions are supported.
# These resources are owned by the Helm release (upgraded and deleted with it).
# ExternalSecret objects (requires External Secrets Operator + a ClusterSecretStore).
#
# Each entry produces one ExternalSecret. The generated Kubernetes Secret keeps
# the entry's `name` by default, so migrating an app off a hand-written Secret
# needs no change to env.secrets / envFrom / secretMounts - only the thing that
# CREATES the Secret changes.
#
# Pair with deploymentAnnotations below: ESO updates the Secret in place when a
# value is rotated in OpenBao, and nothing about that changes the Deployment, so
# without Reloader the pod keeps serving the old value indefinitely. The
# checksum/extra-config annotation does NOT help - it hashes extraObjects, and
# an ESO-managed Secret is created outside Helm entirely.
#
# externalSecrets:
#   # whole path -> every key in OpenBao becomes a key in the Secret
#   - name: unpoller-unifi
#     refreshInterval: 1h
#     dataFrom:
#       - key: kv/apps/unifi
#
#   # explicit mapping, when the Secret's key names must differ from OpenBao's
#   - name: myapp-creds
#     data:
#       - secretKey: MYAPP_PASSWORD
#         remoteRef:
#           key: kv/apps/myapp
#           property: password
externalSecrets: []

# Annotations for the Deployment object itself (NOT the pod template - that is
# podAnnotations). Reloader reads its annotations from the Deployment:
#
#   reloader.stakater.com/auto: "true"           any mounted ConfigMap/Secret
#   secret.reloader.stakater.com/reload: "name"  one named Secret
deploymentAnnotations: {}

extraObjects: []
# Example:
# extraObjects:
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: {{ include "common.names.fullname" . }}-extra
#       namespace: {{ .Release.Namespace }}
#       labels:
#         {{- include "common.labels.standard" . | nindent 8 }}
#     data:
#       key: value
