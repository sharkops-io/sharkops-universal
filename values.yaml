# Default values for linuxserver-universal
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Chart metadata
nameOverride: ""
fullnameOverride: ""

# Image settings
image:
  repository: ""  # Override this for specific LinuxServer.io images
  tag: ""         # Override this for specific tags
  pullPolicy: IfNotPresent
  pullSecrets: []

# Service settings
service:
  type: ClusterIP  # Default type for ports that don't specify their own
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      # type: ClusterIP  # Optional: override default service type for this port
  annotations: {}

# Ingress settings
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additional ingress resources for other ports
additionalIngresses: []
  # Example:
  # - name: daemon
  #   enabled: true
  #   className: "nginx"
  #   annotations:
  #     cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #   hosts:
  #     - host: deluge-daemon.example.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #   tls:
  #     - secretName: deluge-daemon-tls
  #       hosts:
  #         - deluge-daemon.example.com
  #   port: 58846  # Port name or number to route to

# LoadBalancer services for additional ports
loadBalancers: []
  # Example:
  # - name: daemon
  #   enabled: true
  #   type: LoadBalancer
  #   port: 58846
  #   targetPort: 58846
  #   annotations:
  #     service.beta.kubernetes.io/aws-load-balancer-type: nlb

# Persistence settings
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /config

# Security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# LinuxServer.io specific settings
linuxserver:
  # Environment variables
  env:
    PUID: 1000
    PGID: 1000
    TZ: UTC
    # Add more environment variables as needed

  # Additional volumes
  volumes:
    - name: downloads
      mountPath: /downloads
      subPath: ""
    - name: media
      mountPath: /media
      subPath: ""

  # Additional volume claims
  volumeClaims:
    - name: downloads
      size: 10Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    - name: media
      size: 50Gi
      storageClass: ""
      accessMode: ReadWriteOnce

  # Health checks
  healthCheck:
    enabled: true
    path: /
    port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Probes
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

