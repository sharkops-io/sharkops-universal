suite: test deployment volume functionality
templates:
  - deployment.yaml
tests:
  - it: should use existing claims in deployment when specified
    set:
      persistence:
        enabled: true
        existingClaim: "my-existing-config-pvc"
        volumes:
          - name: downloads
            mountPath: /downloads
            persistence:
              enabled: true
              existingClaim: "my-existing-downloads-pvc"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            persistentVolumeClaim:
              claimName: my-existing-config-pvc
      - contains:
          path: spec.template.spec.volumes
          content:
            name: downloads
            persistentVolumeClaim:
              claimName: my-existing-downloads-pvc

  - it: should set runtimeClassName when specified
    set:
      runtimeClassName: nvidia
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: should not set runtimeClassName when empty
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should add extraVolumes to the pod spec
    set:
      extraVolumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi

  - it: should add extraVolumeMounts to the main container
    set:
      extraVolumeMounts:
        - name: dshm
          mountPath: /dev/shm
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: dshm
            mountPath: /dev/shm

  - it: should create secret mounts when specified
    set:
      secretMounts:
        - name: "ssl-certs"
          secretName: "ssl-secret"
          mountPath: "/etc/ssl/certs"
          defaultMode: 0400
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssl-certs
            mountPath: "/etc/ssl/certs"
            defaultMode: 256
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ssl-certs
            secret:
              secretName: ssl-secret
              defaultMode: 256
