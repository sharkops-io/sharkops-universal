suite: test ingress
templates:
  - ingress.yaml
tests:
  - it: should not create ingress when disabled
    values:
      - ingress:
          enabled: false
    asserts:
      - isEmpty

  - it: should create ingress when enabled
    values:
      - ingress:
          enabled: true
          className: "nginx"
          hosts:
            - host: test.example.com
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: test-linuxserver-universal
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: test.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix

  - it: should have correct backend service configuration
    values:
      - ingress:
          enabled: true
          hosts:
            - host: test.example.com
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: test-linuxserver-universal-clusterip
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80

  - it: should have correct labels
    values:
      - ingress:
          enabled: true
          hosts:
            - host: test.example.com
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - equal:
          path: metadata.labels.app.kubernetes.io/name
          value: linuxserver-universal
      - equal:
          path: metadata.labels.app.kubernetes.io/instance
          value: test
      - equal:
          path: metadata.labels.helm.sh/chart
          value: linuxserver-universal-0.1.0

  - it: should support TLS configuration
    values:
      - ingress:
          enabled: true
          hosts:
            - host: test.example.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: test-tls
              hosts:
                - test.example.com
    asserts:
      - isKind:
          of: Ingress
      - contains:
          path: spec.tls
          content:
            secretName: test-tls
            hosts:
              - test.example.com

  - it: should support annotations
    values:
      - ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            nginx.ingress.kubernetes.io/rewrite-target: /
          hosts:
            - host: test.example.com
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.annotations.cert-manager.io/cluster-issuer
          value: letsencrypt-prod
      - equal:
          path: metadata.annotations.nginx.ingress.kubernetes.io/rewrite-target
          value: /