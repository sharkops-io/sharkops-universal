suite: test env.secretRefs
templates:
  - deployment.yaml
tests:
  # Empty by default, so no existing release gains an env var.
  - it: should add no env vars by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VIKUNJA_DATABASE_PASSWORD

  # The case env.secrets cannot express: the env var name and the secret key
  # differ, because an operator chose the key. CNPG writes `password`.
  - it: should map an env var name onto a different secret key
    set:
      env:
        secretRefs:
          - name: VIKUNJA_DATABASE_PASSWORD
            secret: vikunja-database-app
            key: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VIKUNJA_DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vikunja-database-app
                key: password

  - it: should support several mappings across different secrets
    set:
      env:
        secretRefs:
          - {name: A_PASSWORD, secret: db-app, key: password}
          - {name: B_SECRET, secret: app-oidc, key: client_secret}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: A_PASSWORD
            valueFrom: {secretKeyRef: {name: db-app, key: password}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: B_SECRET
            valueFrom: {secretKeyRef: {name: app-oidc, key: client_secret}}

  # env.values must keep working alongside it -- the two render into one list.
  - it: should coexist with plain env values
    set:
      env:
        values: {TZ: UTC}
        secretRefs:
          - {name: DB_PASSWORD, secret: db-app, key: password}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TZ, value: "UTC"}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom: {secretKeyRef: {name: db-app, key: password}}

  # A half-formed entry renders `key:` with no value, which the API server
  # rejects at apply. Fail at render instead, naming the entry.
  - it: should reject an entry missing the key field
    set:
      env:
        secretRefs:
          - {name: DB_PASSWORD, secret: db-app}
    asserts:
      - failedTemplate:
          errorMessage: "sharkops-universal: every env.secretRefs entry needs name, secret and key -- got map[name:DB_PASSWORD secret:db-app]"

  - it: should reject an entry missing the secret field
    set:
      env:
        secretRefs:
          - {name: DB_PASSWORD, key: password}
    asserts:
      - failedTemplate:
          errorMessage: "sharkops-universal: every env.secretRefs entry needs name, secret and key -- got map[key:password name:DB_PASSWORD]"
