suite: test persistent volume claims
templates:
  - pvc.yaml
tests:
  - it: should not create PVC when persistence disabled
    values:
      - persistence:
          enabled: false
    asserts:
      - isEmpty

  - it: should create main PVC when persistence enabled
    values:
      - persistence:
          enabled: true
          size: 5Gi
          storageClass: "fast-ssd"
          accessMode: ReadWriteOnce
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: test-linuxserver-universal
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: should create additional PVCs from volumeClaims
    values:
      - persistence:
          enabled: true
      - linuxserver:
          volumeClaims:
            - name: downloads
              size: 100Gi
              storageClass: "fast-ssd"
              accessMode: ReadWriteOnce
            - name: media
              size: 500Gi
              storageClass: "slow-hdd"
              accessMode: ReadWriteOnce
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: test-linuxserver-universal-downloads
      - equal:
          path: spec.resources.requests.storage
          value: 100Gi
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: should have correct labels
    values:
      - persistence:
          enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.labels.app.kubernetes.io/name
          value: linuxserver-universal
      - equal:
          path: metadata.labels.app.kubernetes.io/instance
          value: test
      - equal:
          path: metadata.labels.helm.sh/chart
          value: linuxserver-universal-0.1.0
