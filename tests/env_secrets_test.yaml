suite: test environment variables and secrets
templates:
  - deployment.yaml
tests:
  - it: should create environment variables from direct values
    set:
      env:
        values:
          LOG_LEVEL: "info"
          DEBUG: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEBUG
            value: "true"

  - it: should create environment variables from ConfigMaps
    set:
      env:
        configMaps:
          - name: "app-config"
          - name: "global-config"
            keys: ["GLOBAL_SETTING", "FEATURE_FLAG"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: app-config
            valueFrom:
              configMapRef:
                name: app-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GLOBAL_SETTING
            valueFrom:
              configMapKeyRef:
                name: global-config
                key: GLOBAL_SETTING
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_FLAG
            valueFrom:
              configMapKeyRef:
                name: global-config
                key: FEATURE_FLAG

  - it: should create environment variables from Secrets
    set:
      env:
        secrets:
          - name: "app-secrets"
            keys: ["DB_PASSWORD", "API_KEY"]
          - name: "global-secrets"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: DB_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: API_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: global-secrets
            valueFrom:
              secretRef:
                name: global-secrets

  - it: should create envFrom section when specified
    set:
      envFrom:
        - configMapRef:
            name: "app-config"
        - secretRef:
            name: "app-secrets"
        - configMapRef:
            name: "global-config"
            optional: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: app-config
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: app-secrets
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: global-config
              optional: true

  - it: should create secret mounts when specified
    set:
      secretMounts:
        - name: "ssl-certs"
          secretName: "ssl-secret"
          mountPath: "/etc/ssl/certs"
          defaultMode: 0400
        - name: "config-files"
          secretName: "app-config-secret"
          mountPath: "/etc/app/config"
          subPath: "config.yaml"
          defaultMode: 0600
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssl-certs
            mountPath: "/etc/ssl/certs"
            defaultMode: 256
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config-files
            mountPath: "/etc/app/config"
            subPath: "config.yaml"
            defaultMode: 384
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ssl-certs
            secret:
              secretName: ssl-secret
              defaultMode: 256
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config-files
            secret:
              secretName: app-config-secret
              defaultMode: 384
