suite: test network policy
templates:
  - networkpolicy.yaml
tests:
  - it: should not render when disabled
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an Ingress-only policy when enabled
    set:
      networkPolicy:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: networking.k8s.io/v1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.policyTypes
          value: ["Ingress"]

  # Phase 2 guard. An egress block here silently breaks DNS for the release,
  # which is why phase 1 is ingress-only and phase 2 uses a sibling
  # CiliumNetworkPolicy instead of extending this template.
  - it: should never emit an egress block
    set:
      networkPolicy:
        enabled: true
        extraIngress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: other
    asserts:
      - notExists:
          path: spec.egress

  # The silent-failure guard: a default-deny namespace simply stops being
  # scraped. The target goes down, the metric vanishes, and nothing else
  # complains. Hence allowPrometheus defaults TRUE.
  - it: should allow prometheus by default
    set:
      networkPolicy:
        enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus

  - it: should produce an empty allowlist when both defaults are off
    set:
      networkPolicy:
        enabled: true
        allowPrometheus: false
        allowIngressController: false
    asserts:
      - equal:
          path: spec.ingress
          value: []

  - it: should append extraIngress rules verbatim
    set:
      networkPolicy:
        enabled: true
        allowPrometheus: false
        allowIngressController: false
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: cnpg-system
            ports:
              - port: 8000
                protocol: TCP
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8000

  - it: should AND extraPodSelectorLabels into the podSelector
    set:
      networkPolicy:
        enabled: true
        extraPodSelectorLabels:
          app: barman-cloud
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app"]
          value: barman-cloud
