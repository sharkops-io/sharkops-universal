suite: test load balancers
templates:
  - loadbalancers.yaml
tests:
  - it: should not create load balancers when empty
    values:
      - loadBalancers: []
    asserts:
      - isEmpty

  - it: should create load balancer when enabled
    values:
      - loadBalancers:
          - name: daemon
            enabled: true
            type: LoadBalancer
            port: 58846
            targetPort: 58846
            protocol: TCP
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-linuxserver-universal-daemon
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: should have correct port configuration
    values:
      - loadBalancers:
          - name: daemon
            enabled: true
            type: LoadBalancer
            port: 58846
            targetPort: 58846
            protocol: TCP
    asserts:
      - isKind:
          of: Service
      - contains:
          path: spec.ports
          content:
            name: daemon
            port: 58846
            targetPort: 58846
            protocol: TCP

  - it: should have correct selector
    values:
      - loadBalancers:
          - name: daemon
            enabled: true
            type: LoadBalancer
            port: 58846
            targetPort: 58846
            protocol: TCP
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.selector.app.kubernetes.io/name
          value: linuxserver-universal
      - equal:
          path: spec.selector.app.kubernetes.io/instance
          value: test

  - it: should support annotations
    values:
      - loadBalancers:
          - name: daemon
            enabled: true
            type: LoadBalancer
            port: 58846
            targetPort: 58846
            protocol: TCP
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.annotations.service.beta.kubernetes.io/aws-load-balancer-type
          value: "nlb"
      - equal:
          path: metadata.annotations.service.beta.kubernetes.io/aws-load-balancer-scheme
          value: "internet-facing"

  - it: should have correct labels
    values:
      - loadBalancers:
          - name: daemon
            enabled: true
            type: LoadBalancer
            port: 58846
            targetPort: 58846
            protocol: TCP
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.labels.app.kubernetes.io/name
          value: linuxserver-universal
      - equal:
          path: metadata.labels.app.kubernetes.io/instance
          value: test
      - equal:
          path: metadata.labels.helm.sh/chart
          value: linuxserver-universal-0.1.0

  - it: should skip disabled load balancers
    values:
      - loadBalancers:
          - name: daemon
            enabled: false
            type: LoadBalancer
            port: 58846
            targetPort: 58846
            protocol: TCP
          - name: api
            enabled: true
            type: LoadBalancer
            port: 8080
            targetPort: 8080
            protocol: TCP
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-linuxserver-universal-api
