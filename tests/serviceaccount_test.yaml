suite: test service account
templates:
  - serviceaccount.yaml
tests:
  - it: should create service account when enabled
    values:
      - serviceAccount:
          create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-linuxserver-universal

  - it: should not create service account when disabled
    values:
      - serviceAccount:
          create: false
    asserts:
      - isEmpty

  - it: should have correct labels
    values:
      - serviceAccount:
          create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.labels.app.kubernetes.io/name
          value: linuxserver-universal
      - equal:
          path: metadata.labels.app.kubernetes.io/instance
          value: test
      - equal:
          path: metadata.labels.helm.sh/chart
          value: linuxserver-universal-0.1.0

  - it: should support custom annotations
    values:
      - serviceAccount:
          create: true
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/test-role"
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations.eks.amazonaws.com/role-arn
          value: "arn:aws:iam::123456789012:role/test-role"

  - it: should use custom name when provided
    values:
      - serviceAccount:
          create: true
          name: "custom-service-account"
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: custom-service-account
