suite: oauth2proxy sidecar
templates:
  - deployment.yaml
  - service.yaml
tests:
  - it: should not inject sidecar when disabled
    template: deployment.yaml
    set:
      image.repository: test/app
      image.tag: latest
      service.ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: should inject sidecar when enabled
    template: deployment.yaml
    set:
      image.repository: test/app
      image.tag: latest
      service.ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
      oauth2proxy.enabled: true
      oauth2proxy.existingSecret: oauth2-proxy-credentials
      oauth2proxy.issuerUrl: https://auth.example.com
      oauth2proxy.redirectUrl: https://test.example.com/oauth2/callback
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: oauth2-proxy

  - it: should reroute service targetPort to 4180 when enabled
    template: service.yaml
    set:
      image.repository: test/app
      image.tag: latest
      service.ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
      oauth2proxy.enabled: true
      oauth2proxy.existingSecret: oauth2-proxy-credentials
      oauth2proxy.issuerUrl: https://auth.example.com
      oauth2proxy.redirectUrl: https://test.example.com/oauth2/callback
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 4180

  - it: should keep original targetPort when oauth2proxy disabled
    template: service.yaml
    set:
      image.repository: test/app
      image.tag: latest
      service.ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: should pass the issuer and scope cookie and redirect whitelist to cookieDomain
    template: deployment.yaml
    set:
      image.repository: test/app
      image.tag: latest
      service.ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
      oauth2proxy.enabled: true
      oauth2proxy.existingSecret: oauth2-proxy-credentials
      oauth2proxy.issuerUrl: https://auth.example.com
      oauth2proxy.redirectUrl: https://test.example.com/oauth2/callback
      oauth2proxy.cookieDomain: .example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --oidc-issuer-url=https://auth.example.com
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cookie-domain=.example.com
      - contains:
          path: spec.template.spec.containers[1].args
          content: --whitelist-domain=.example.com

  # Empty cookieDomain (the default) must omit both flags rather than render
  # `--cookie-domain=`; oauth2-proxy then scopes the cookie to the app's host.
  - it: should omit --cookie-domain and --whitelist-domain when cookieDomain is empty
    template: deployment.yaml
    set:
      image.repository: test/app
      image.tag: latest
      service.ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
      oauth2proxy.enabled: true
      oauth2proxy.existingSecret: oauth2-proxy-credentials
      oauth2proxy.issuerUrl: https://auth.example.com
      oauth2proxy.redirectUrl: https://test.example.com/oauth2/callback
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].args
          content: --cookie-domain=
      - notContains:
          path: spec.template.spec.containers[1].args
          content: --whitelist-domain=

  # No default issuer: a guessed one would only fail at login time.
  - it: should fail to render the sidecar without issuerUrl
    template: deployment.yaml
    set:
      image.repository: test/app
      image.tag: latest
      service.ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
      oauth2proxy.enabled: true
      oauth2proxy.existingSecret: oauth2-proxy-credentials
      oauth2proxy.redirectUrl: https://test.example.com/oauth2/callback
    asserts:
      - failedTemplate:
          errorPattern: "oauth2proxy.issuerUrl is required"
