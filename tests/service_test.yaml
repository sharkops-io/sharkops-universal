suite: test service
templates:
  - service.yaml
tests:
  - it: should create a service with correct metadata
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-linuxserver-universal-clusterip
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should have correct port configuration
    asserts:
      - contains:
          path: spec.ports
          content:
            name: http
            port: 80
            targetPort: 80
            protocol: TCP

  - it: should have correct selector
    asserts:
      - equal:
          path: spec.selector.app.kubernetes.io/name
          value: linuxserver-universal
      - equal:
          path: spec.selector.app.kubernetes.io/instance
          value: test

  - it: should have correct labels
    asserts:
      - equal:
          path: metadata.labels.app.kubernetes.io/name
          value: linuxserver-universal
      - equal:
          path: metadata.labels.app.kubernetes.io/instance
          value: test
      - equal:
          path: metadata.labels.helm.sh/chart
          value: linuxserver-universal-0.1.0

  - it: should create multiple services for different service types
    values:
      - service:
          ports:
            - name: web
              port: 80
              targetPort: 80
              protocol: TCP
            - name: daemon
              port: 58846
              targetPort: 58846
              protocol: TCP
              type: LoadBalancer
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-linuxserver-universal-clusterip
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: web
            port: 80
            targetPort: 80
            protocol: TCP