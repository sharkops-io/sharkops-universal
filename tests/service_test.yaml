suite: test service
templates:
  - service.yaml
tests:
  - it: should create a service with default values
    set:
      global:
        service:
          type: ClusterIP
          port: 80
          targetPort: 80
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-linuxserver-universal
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 80
      - equal:
          path: spec.ports[0].name
          value: http

  - it: should create a service with custom values
    set:
      global:
        service:
          type: NodePort
          port: 32400
          targetPort: 32400
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 32400
      - equal:
          path: spec.ports[0].targetPort
          value: 32400
      - contains:
          path: metadata.annotations
          content:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
