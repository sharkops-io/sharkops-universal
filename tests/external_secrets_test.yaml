suite: test external secrets
templates:
  - external-secrets.yaml
tests:
  - it: should not render when externalSecrets is empty
    set:
      externalSecrets: []
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one ExternalSecret per entry
    set:
      externalSecrets:
        - name: first
          dataFrom:
            - key: kv/apps/one
        - name: second
          dataFrom:
            - key: kv/apps/two
    asserts:
      - hasDocuments:
          count: 2

  # This is the assertion that matters most. ESO 2.x serves v1beta1 as
  # served: false, so a v1beta1 manifest is rejected by the API server outright.
  # Almost every example online is still v1beta1, which makes this an easy
  # regression to introduce and a confusing one to diagnose.
  - it: should use the v1 API version, never v1beta1
    set:
      externalSecrets:
        - name: creds
          dataFrom:
            - key: kv/apps/thing
    asserts:
      - isAPIVersion:
          of: external-secrets.io/v1
      - isKind:
          of: ExternalSecret

  - it: should default the store to the openbao ClusterSecretStore
    set:
      externalSecrets:
        - name: creds
          dataFrom:
            - key: kv/apps/thing
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: openbao
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.refreshInterval
          value: 1h

  # Migrating an app off a hand-written Secret must not require touching
  # env.secrets/envFrom/secretMounts, so the produced Secret keeps this name.
  - it: should name the produced Secret after the entry by default
    set:
      externalSecrets:
        - name: unpoller-unifi
          dataFrom:
            - key: kv/apps/unifi
    asserts:
      - equal:
          path: spec.target.name
          value: unpoller-unifi
      - equal:
          path: spec.target.creationPolicy
          value: Owner

  - it: should allow overriding the target Secret name
    set:
      externalSecrets:
        - name: my-es
          target:
            name: a-different-secret
          dataFrom:
            - key: kv/apps/thing
    asserts:
      - equal:
          path: spec.target.name
          value: a-different-secret

  - it: should render dataFrom as an extract block
    set:
      externalSecrets:
        - name: creds
          dataFrom:
            - key: kv/apps/unifi
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: kv/apps/unifi
      - notExists:
          path: spec.data

  - it: should render explicit key mappings
    set:
      externalSecrets:
        - name: creds
          data:
            - secretKey: UP_UNIFI_DEFAULT_PASS
              remoteRef:
                key: kv/apps/unifi
                property: password
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: UP_UNIFI_DEFAULT_PASS
      - equal:
          path: spec.data[0].remoteRef.key
          value: kv/apps/unifi
      - equal:
          path: spec.data[0].remoteRef.property
          value: password
      - notExists:
          path: spec.dataFrom

  - it: should honour a custom refreshInterval and store
    set:
      externalSecrets:
        - name: creds
          refreshInterval: 15s
          secretStoreRef:
            name: other-store
            kind: SecretStore
          dataFrom:
            - key: kv/apps/thing
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 15s
      - equal:
          path: spec.secretStoreRef.name
          value: other-store
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
