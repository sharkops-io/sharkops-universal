# One-off: copies the chart versions already on registry.gitlab.com to GHCR with
# the same digests. Delete once the GitLab registry is retired.
name: import-from-gitlab

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  import:
    uses: sharkops-io/.github/.github/workflows/import-from-gitlab.yml@main
    with:
      source: registry.gitlab.com/sharkops/helm-charts/sharkops-universal/sharkops-universal
      destination: ghcr.io/sharkops-io/charts/sharkops-universal
      tag-pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    permissions:
      contents: read
      packages: write
